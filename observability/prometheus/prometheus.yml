# Scrapes the OTel Collector's Prometheus exporter (see
# ../otel-collector/otel-collector-config.yaml). This is what
# PROMETHEUS_URL (packages/server/.env.example) should point at.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
