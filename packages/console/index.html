<!doctype html>
<!--
  No `class="dark"` here: light is the default theme. Adding that class to
  <html> switches to the dark ops palette and activates shadcn/ui's built-in
  `dark:` utilities (see the @custom-variant in src/index.css). The inline
  script below applies a stored preference before first paint so a dark-mode
  user never sees a white flash.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriftWatch Autopilot</title>
    <script>
      // Deliberately inline and synchronous — running this from a module would
      // paint the default theme first, then repaint.
      try {
        if (localStorage.getItem('driftwatch.theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch {
        /* private mode / storage disabled — fall back to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
